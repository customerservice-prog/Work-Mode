name: Build Work-Mode Windows installer
on:
  push:
    branches: [main, feature/windows-desktop-installer, feature/desktop-first-run-setup]
    paths:
      - 'desktop/**'
      - 'server.js'
      - 'lib/**'
      - 'public/**'
      - 'package.json'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Verify JavaScript syntax
        run: |
          node --check server.js
          node --check desktop/main.mjs
          node --check public/app.js
          node --check public/extra.js
          node --check public/settings.js
      - name: Build installable Windows desktop app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run desktop:build
      - name: Launch packaged desktop app and verify its local server
        shell: pwsh
        run: |
          $appPath = (Resolve-Path "dist/win-unpacked/Work-Mode.exe").Path
          $started = Start-Process -FilePath $appPath -PassThru
          try {
            $healthy = $false
            for ($i = 0; $i -lt 20; $i++) {
              if ($started.HasExited) { break }
              try {
                $res = Invoke-RestMethod -Uri "http://127.0.0.1:3168/api/health" -TimeoutSec 2
                if ($res.service -eq "Work-Mode" -and $res.ok -eq $true) {
                  $healthy = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $healthy) { throw "Packaged desktop app failed to start its local HTTP server" }
            Start-Sleep -Seconds 2
            $started.Refresh()
            if ($started.HasExited) { throw "Packaged desktop app quit unexpectedly after startup" }
            $html = (Invoke-WebRequest -Uri "http://127.0.0.1:3168" -UseBasicParsing -TimeoutSec 5).Content
            if ($html -notmatch 'downloadLocalModel') { throw "In-app local AI download interface is missing" }
            $ollama = Invoke-RestMethod -Uri "http://127.0.0.1:3168/api/local-ai/status" -TimeoutSec 5
            if ($null -eq $ollama.running) { throw "Local AI status endpoint returned no running field" }
            Write-Host "Packaged desktop app launched; first-run setup and local AI endpoint confirmed."
          } finally {
            Get-CimInstance Win32_Process -Filter "name = 'Work-Mode.exe'" |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          }
      - name: Verify installer and bundled application files
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem -Path "dist" -Filter "Work-Mode-Setup-*.exe" -File)
          if ($installer.Count -ne 1) { throw "Expected one Work-Mode setup EXE; found $($installer.Count)" }
          if ($installer[0].Length -lt 15000000) { throw "Setup EXE is unexpectedly small" }
          if (!(Test-Path "dist/win-unpacked/resources/app.asar")) { throw "Application package was not generated" }
          Write-Host "Verified $($installer[0].Name) ($([math]::Round($installer[0].Length/1MB, 1)) MB)"
      - name: Attach installer as downloadable GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Work-Mode-Desktop-Windows-Setup
          path: dist/Work-Mode-Setup-*.exe
          retention-days: 30
          if-no-files-found: error
      - name: Publish installer to GitHub Releases
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = (Get-ChildItem "dist" -Filter "Work-Mode-Setup-*.exe" -File | Select-Object -First 1).FullName
          $tag = "v0.3.0"
          gh release view $tag --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag $exe --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Work-Mode Desktop v0.3.0 for Windows" --prerelease --notes "Windows desktop installer with in-app local AI model download, setup checks and browser control. Unsigned early release; real authenticated website tasks still require testing. Windows with Microsoft Edge required."
          }
