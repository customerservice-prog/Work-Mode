name: Work-Mode smoke verification
on:
  push:
  pull_request:
jobs:
  check:
    timeout-minutes: 3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium for browser test
        run: npx playwright install --with-deps chromium
      - name: Verify container startup script
        run: |
          sh -n docker-entrypoint.sh
          if WORKMODE_CLOUD_MODE=1 WORKMODE_DATA_DIR=/not-data sh docker-entrypoint.sh true; then
            echo 'Expected unsafe mount path to be rejected'
            exit 1
          fi
      - name: Syntax checks
        run: |
          node --check server.js
          node --check public/app.js
          node --check public/extra.js
          node --check lib/safety.js
          node --check lib/history.js
          node --check lib/settings.js
          node --check lib/hosted-auth.js
          node --check lib/cloud-config.js
          node --check lib/cloud-budget.js
          node --check lib/hosted-ai.js
          node --check lib/task-journal.js
          node --check lib/basic-commands.js
          node --check public/remote.js
          node --check public/mobile.js
          node --check lib/local-ai.js
          node --check public/settings.js
          node --check public/edge-tabs.js
          node --check public/edge-facebook.js
          node --check extension/background.js
          node --check extension/bridge.js
          node --check extension/popup.js
          node --check extension/policy.js
      - name: Package Edge connector
        uses: actions/upload-artifact@v4
        with:
          name: Work-Mode-Edge-Connector
          path: extension/
          if-no-files-found: error
          retention-days: 30
      - name: Local server smoke test
        run: timeout 85s npm test
